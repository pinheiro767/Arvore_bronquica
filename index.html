<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07151f">
<title>Árvore brônquica — revisão imersiva</title>
<style>
:root {
  --bg:#07151f;
  --panel:#0d2230e8;
  --panel2:#102c3d;
  --line:#27495e;
  --text:#f5fbff;
  --muted:#b5cad6;
  --accent:#66c7df;
  --ok:#53d69d;
  --warn:#ffd36a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit}
#app{position:fixed;inset:0;background:
radial-gradient(circle at 50% 10%,rgba(47,112,143,.18),transparent 34%),
linear-gradient(180deg,#06131c,#081923)}

.topbar{
 position:absolute;left:0;right:0;top:0;z-index:20;
 padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
 display:flex;gap:8px;align-items:center;justify-content:space-between;
 background:linear-gradient(180deg,rgba(5,17,25,.96),rgba(5,17,25,.60),transparent);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#123247;border:1px solid var(--line);font-size:20px}
.title{min-width:0}
.title strong{display:block;font-size:15px;letter-spacing:.2px}
.title span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:7px}
.ctrl{
 border:1px solid var(--line);background:#102837d9;color:var(--text);
 min-width:42px;height:42px;border-radius:13px;padding:0 12px;
 display:grid;place-items:center;cursor:pointer;font-weight:800;
}
.ctrl:active{transform:scale(.97)}

.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.image-wrap{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%) scale(1);
 transform-origin:center center;
 will-change:transform;
}
.atlas{
 display:block;
 width:min(88vw, 900px);
 max-width:none;
 height:auto;
 border-radius:18px;
 box-shadow:0 24px 70px rgba(0,0,0,.45);
 user-select:none;-webkit-user-drag:none;
}

.zoomtip{
 position:absolute;left:50%;top:86px;transform:translateX(-50%);
 z-index:12;background:#0b2230cc;border:1px solid var(--line);
 color:var(--muted);padding:7px 11px;border-radius:999px;font-size:12px;
 backdrop-filter:blur(10px);transition:.3s
}

.study-card{
 position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
 z-index:25;width:min(94vw,760px);
 background:linear-gradient(180deg,rgba(14,39,54,.97),rgba(8,27,39,.97));
 border:1px solid var(--line);border-radius:22px;padding:14px;
 box-shadow:0 18px 50px rgba(0,0,0,.38);backdrop-filter:blur(14px)
}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.progress{height:7px;flex:1;background:#173242;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:.25s}
.counter{font-size:12px;color:var(--muted);font-weight:800;min-width:54px;text-align:right}
.prompt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:900}
.structure{font-size:clamp(18px,4vw,25px);line-height:1.15;margin:5px 0 11px;font-weight:850}
.hint{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:12px}
.actions{display:grid;grid-template-columns:1.25fr 1fr 52px;gap:8px}
.primary,.secondary,.next{
 border:0;border-radius:14px;height:46px;font-weight:850;cursor:pointer
}
.primary{background:var(--ok);color:#062116}
.secondary{background:#17394d;color:var(--text);border:1px solid #285a74}
.next{background:#203c4d;color:var(--text);font-size:20px}
.done-state{background:#173c31!important;color:#bdf4da!important}

.drawer{
 position:absolute;right:0;top:0;bottom:0;z-index:40;width:min(92vw,390px);
 transform:translateX(105%);transition:.28s ease;
 background:#091c28f5;border-left:1px solid var(--line);
 backdrop-filter:blur(18px);display:flex;flex-direction:column
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.drawer h2{font-size:18px;margin:0}
.drawer-scroll{padding:12px;overflow:auto;flex:1}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #1f4052;border-radius:14px;margin-bottom:8px;background:#0e2735}
.item.done{border-color:#377b63;background:#0d2d27}
.chk{width:26px;height:26px;border-radius:8px;border:1px solid #3d667d;display:grid;place-items:center;flex:0 0 26px;color:transparent;background:#0b1f2a}
.item.done .chk{color:#082117;background:var(--ok);border-color:var(--ok)}
.item span{font-size:13px;line-height:1.35}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.48);z-index:35;display:none}
.overlay.show{display:block}

.focus-mode .topbar,.focus-mode .zoomtip{opacity:0;pointer-events:none}
.focus-mode .study-card{opacity:.16;transition:.25s}
.focus-mode .study-card:hover,.focus-mode .study-card:active{opacity:1}

@media(max-width:700px){
 .atlas{width:min(96vw,760px)}
 .title span{display:none}
 .ctrl.txt{display:none}
 .study-card{padding:12px;border-radius:19px}
 .actions{grid-template-columns:1fr 1fr 48px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="icon">🫁</div>
      <div class="title">
        <strong>Árvore brônquica</strong>
        <span>Revisão prática imersiva • peça anatômica + atlas</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="ctrl" onclick="zoomBy(1.15)" title="Aproximar">＋</button>
      <button class="ctrl" onclick="zoomBy(0.87)" title="Afastar">−</button>
      <button class="ctrl txt" onclick="resetView()" title="Centralizar">Centralizar</button>
      <button class="ctrl" onclick="toggleFocus()" title="Modo imersivo">◉</button>
      <button class="ctrl" onclick="toggleDrawer()" title="Lista de estruturas">☰</button>
    </div>
  </div>

  <div class="zoomtip" id="zoomtip">Arraste para mover • use pinça ou +/− para ampliar</div>

<script>
const structures = ["Bifurcação da traqueia", "Brônquio principal direito", "Brônquio lobar superior direito", "B I — Brônquio segmentar apical direito", "B II — Brônquio segmentar posterior direito", "B III — Brônquio segmentar anterior direito", "Brônquio lobar médio direito", "B IV — Brônquio segmentar lateral direito", "B V — Brônquio segmentar medial direito", "Brônquio lobar inferior direito", "B VI — Brônquio segmentar superior direito", "B VII — Brônquio segmentar basilar medial direito", "B VIII — Brônquio segmentar basilar anterior direito", "B IX — Brônquio segmentar basilar lateral direito", "B X — Brônquio segmentar basilar posterior direito", "Brônquio principal esquerdo", "Brônquio lobar superior esquerdo", "B I + II — Brônquio segmentar apicoposterior esquerdo", "B III — Brônquio segmentar anterior esquerdo", "B IV — Brônquio lingular superior", "B V — Brônquio lingular inferior", "Brônquio lobar inferior esquerdo", "B VI — Brônquio segmentar superior esquerdo", "B VII — Brônquio segmentar basilar medial esquerdo", "B VIII — Brônquio segmentar basilar anterior esquerdo", "B IX — Brônquio segmentar basilar lateral esquerdo", "B X — Brônquio segmentar basilar posterior esquerdo"];
let current = 0;
let completed = new Set(JSON.parse(localStorage.getItem('arvoreBronquicaDone') || '[]'));

let scale = 1, x = 0, y = 0;
let dragging = false, sx = 0, sy = 0, startX = 0, startY = 0;
let pinchStartDist = null, pinchStartScale = 1;

const stage = document.getElementById('stage');
const wrap = document.getElementById('imageWrap');
const structureEl = document.getElementById('structure');
const foundBtn = document.getElementById('foundBtn');

function applyTransform() {
  wrap.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
}
function zoomBy(mult) {
  scale = Math.min(4.5, Math.max(.65, scale * mult));
  applyTransform();
}
function resetView() {
  scale = 1; x = 0; y = 0; applyTransform();
}
function zoomToBronchi() {
  scale = window.innerWidth < 700 ? 1.65 : 1.45;
  x = 0;
  y = window.innerWidth < 700 ? -125 : -85;
  applyTransform();
  document.getElementById('zoomtip').style.opacity = 0;
}

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.study-card') || e.target.closest('.topbar')) return;
  dragging = true; stage.classList.add('dragging');
  sx = e.clientX; sy = e.clientY; startX = x; startY = y;
  stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if(!dragging) return;
  x = startX + (e.clientX - sx);
  y = startY + (e.clientY - sy);
  applyTransform();
});
stage.addEventListener('pointerup', () => { dragging=false; stage.classList.remove('dragging'); });
stage.addEventListener('pointercancel', () => { dragging=false; stage.classList.remove('dragging'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : .9);
}, {passive:false});

stage.addEventListener('touchstart', e => {
  if(e.touches.length === 2) {
    const [a,b] = e.touches;
    pinchStartDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    pinchStartScale = scale;
  }
}, {passive:true});
stage.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinchStartDist) {
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    scale = Math.min(4.5, Math.max(.65, pinchStartScale * d/pinchStartDist));
    applyTransform();
  }
}, {passive:true});
stage.addEventListener('touchend', () => pinchStartDist=null);

function save() {
  localStorage.setItem('arvoreBronquicaDone', JSON.stringify([...completed]));
}
function renderStudy() {
  structureEl.textContent = structures[current];
  document.getElementById('counter').textContent = `${current+1}/${structures.length}`;
  const isDone = completed.has(current);
  foundBtn.textContent = isDone ? '✓ Localizada' : '✓ Encontrei na peça';
  foundBtn.classList.toggle('done-state', isDone);
  document.getElementById('bar').style.width = `${(completed.size/structures.length)*100}%`;
  renderDrawer();
}
function markFound() {
  if(completed.has(current)) completed.delete(current);
  else completed.add(current);
  save(); renderStudy();
}
function nextItem() {
  current = (current + 1) % structures.length;
  renderStudy();
}
function jumpTo(i) {
  current = i; renderStudy(); toggleDrawer(false);
}
function renderDrawer() {
  const list = document.getElementById('drawerList');
  list.innerHTML = structures.map((s,i)=>`
    <div class="item ${completed.has(i)?'done':''}" onclick="jumpTo(${i})">
      <div class="chk">${completed.has(i)?'✓':''}</div>
      <span><strong>${String(i+1).padStart(2,'0')}</strong> — ${s}</span>
    </div>
  `).join('');
}
function toggleDrawer(force) {
  const d = document.getElementById('drawer');
  const o = document.getElementById('overlay');
  const open = force === undefined ? !d.classList.contains('open') : force;
  d.classList.toggle('open', open); o.classList.toggle('show', open);
}
function toggleFocus() {
  document.getElementById('app').classList.toggle('focus-mode');
}
renderStudy();
applyTransform();
setTimeout(()=>document.getElementById('zoomtip').style.opacity=.35,3500);
</script>
</body>
</html>
